# Review wiring: the writer, the model registry, and slot -> (model, effort, timeout).
#
# The single source of truth for every review pin (D00 T04 §27). Skills
# name slots and run them through `python scripts/panel_slots.py exec
# <slot>`; they never name a model. `scripts/panel_slots.py` validates
# this file: the slot set is exact, every slot names a registered,
# non-retired model, efforts are a closed set, same-family fallbacks
# repeat their leader's effort, and every governing slot is a different
# family from the writer, so the writer never signs off its own work.
#
# Re-pinning a reviewer is an edit here plus a fresh echo probe date on
# the model entry; nothing else in the tree changes.

# Operator decision 2026-09-23: Claude Code on Opus 5.5 is the only writer.
[writer]
model = "claude-opus-5-5"

# The model registry. `family` picks the runner (codex or claude).
# `probed` is the date of the last live echo probe through that runner.
# `retired` marks pins only historical records name: run records and
# stamps keep parsing, and no slot may use them.
[model."gpt-6-sol"]
family = "codex"
probed = "2026-09-23"

[model."gpt-5.6-terra"]
family = "codex"
probed = "2026-09-23"

[model."claude-opus-5-5"]
family = "claude"
probed = "2026-09-23"

[model."gpt-5.6-sol"]
family = "codex"
retired = "2026-09-23"

[model."gpt-6-astra"]
family = "codex"
retired = "2026-09-17"

[model."opus"]
family = "claude"
retired = "2026-09-23"

# Panel rounds. Full: R1-R2 bulk, R3 signoff, R4-R5 depth (blocking
# findings only). Light: R1 bulk, R2 signoff.
[slot.bulk]
model = "gpt-6-sol"
effort = "medium"
timeout = 600

[slot.signoff] # governs every stamp from 2026-09-23
model = "gpt-6-sol"
effort = "high"
timeout = 600

[slot.depth]
model = "gpt-6-sol"
effort = "high"
timeout = 600

# Sol down: same family, same effort as the slot it replaces.
[slot.bulk-fallback]
model = "gpt-5.6-terra"
effort = "medium"
timeout = 600

[slot.signoff-fallback] # replaces signoff or depth
model = "gpt-5.6-terra"
effort = "high"
timeout = 600

# Both GPT pins down: the writer's family fills any panel round, sign-off
# included, and the round record owes a `GPT outage` note.
[slot.cross-fill]
model = "claude-opus-5-5"
effort = "high"
timeout = 600

# Plan review after panel close.
[slot.plan-primary]
model = "gpt-6-sol"
effort = "high"
timeout = 900

# Plan review fallback: the writer's family, so the marker owes a retry.
[slot.plan-fallback]
model = "claude-opus-5-5"
effort = "high"
timeout = 900

# The staged-stamp review before the stamp commit.
[slot.stamp-check]
model = "gpt-6-sol"
effort = "high"
timeout = 600

# The independent `codex review --commit` pass in process-todo-section.
[slot.independent]
model = "gpt-6-sol"
effort = "high"
timeout = 900

# The architecture gate after panel close (framework state, storage,
# extension seams, elevation, restore/undo). Blocking, GPT like the sign-off.
[slot.arch-primary]
model = "gpt-6-sol"
effort = "high"
timeout = 600

# Sol down at the gate: same family, same effort.
[slot.arch-fallback]
model = "gpt-5.6-terra"
effort = "high"
timeout = 900
