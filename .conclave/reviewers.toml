# One writer and one reviewer per section. Historical receipts replay their original pin.
# Operator 2026-11-14: Carbon uses its provider default; Astra uses pinned medium.
# Preserve completion-last, lenses and the 32 follow-up limit (33 rounds total).
# Codex is reviewed by Carbon; other writers by Astra. Claude is never a reviewer.
schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[reviewers.carbon]
cli = "agy"
model = "gemini-pro-orchestrator"

[routes]
claude = ["astra"]
codex = ["carbon"]
gemini = ["astra"]
muse = ["astra"]
meta = ["astra"]

# Carbon takes no effort override. Astra uses its pinned medium on every pass.
[schedule]
completion_order = "last"
max_low_rounds = 32
severity_stop_after = 0

[schedule.plan]
lenses = ["plan"]

[[schedule.rounds]]
lenses = ["adversarial"]

[schedule.rotation]
lenses = ["consistency", "quality", "integration", "source-defect", "design", "optimization", "record", "plan-delivery"]

[schedule.escalation]
lenses = ["adversarial"]

[schedule.completion]
