# Operator 2026-11-14: Claude and Antigravity write; Codex Astra reviews both.
# Medium first pass, low follow-ups; preserve lenses and the 33-round cap.
schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[routes]
claude = ["astra"]
gemini = ["astra"]

[schedule]
completion_order = "last"
max_low_rounds = 32
severity_stop_after = 0

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial"]

[schedule.rotation]
effort = "low"
lenses = ["consistency", "quality", "integration", "source-defect", "design", "optimization", "record", "plan-delivery"]

[schedule.escalation]
effort = "low"
lenses = ["adversarial"]

[schedule.completion]
effort = "medium"
